name: Bygg G2 Meldinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # ---------- Android-hjelpeappen ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Dekrypter signeringsnøkkel
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mangler KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/signing/g2meldinger.jks.enc -out android/signing/g2meldinger.jks \
            -pass env:KEYSTORE_PASSWORD

      - name: Bygg APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Gi APK-en et fast navn
        run: cp android/app/build/outputs/apk/release/app-release.apk g2-meldinger-${VERSION_NAME}.apk

      # ---------- Even Hub-appen (brillene) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bygg og pakk .ehpk
        working-directory: plugin
        run: |
          npm ci
          npm run build
          npx evenhub pack app.json dist -o ../g2-meldinger.ehpk --sdk-ver 0.0.16

      # ---------- Release (Obtainium henter APK-en herfra) ----------
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: G2 Meldinger ${{ env.VERSION_NAME }}
          files: |
            g2-meldinger-${{ env.VERSION_NAME }}.apk
            g2-meldinger.ehpk
